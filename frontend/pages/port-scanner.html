<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Scanner - CyberKit Pro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/phosphor-icons"></script>
    <link rel="stylesheet" href="../css/port-scanner.css">
</head>
<body class="bg-gradient">
    <nav class="navbar">
        <div class="nav-content">
            <div class="nav-logo">
                <a href="../index.html">
                    <i class="ph-shield-star"></i>
                    <span>CyberKit Pro</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="../index.html">Tools</a>
                <a href="#">Documentation</a>
                <a href="#">About</a>
                <button class="theme-toggle" id="theme-toggle">
                    <i class="ph-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="container tool-page">
        <header class="tool-header">
            <div class="tool-header-content">
                <div class="tool-icon lg">
                    <i class="ph-scan"></i>
                </div>
                <div class="tool-info">
                    <h1>Port Scanner</h1>
                    <p>Scan and analyze network ports for security assessment</p>
                </div>
            </div>
        </header>

        <div class="tool-container">
            <form id="port-scanner-form" class="tool-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="target">Target Host</label>
                        <input type="text" id="target" class="input-field" 
                            placeholder="Enter IP or domain name" required>
                        <div class="input-help">
                            Example: 192.168.1.1 or example.com
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="port-range">Port Range</label>
                        <input type="text" id="port-range" class="input-field" 
                            placeholder="Enter port range" pattern="\d+-\d+" required>
                        <div class="input-help">
                            Example: 1-1000 or 80-443
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="button-primary">
                        <i class="ph-scan"></i>
                        Start Scan
                    </button>
                    <button type="reset" class="button-secondary">
                        <i class="ph-x-circle"></i>
                        Clear
                    </button>
                </div>
            </form>

            <div id="scan-results" class="results-panel hidden">
                <div class="results-header">
                    <h3>Scan Results</h3>
                    <div class="results-actions">
                        <button class="button-icon" title="Export Results">
                            <i class="ph-download-simple"></i>
                        </button>
                        <button class="button-icon" title="Copy to Clipboard">
                            <i class="ph-copy"></i>
                        </button>
                    </div>
                </div>
                <div class="results-container">
                    <div class="loading-indicator hidden">
                        <div class="spinner"></div>
                        <p>Scanning ports...</p>
                    </div>
                    <div class="results-table">
                        <!-- Results will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="../js/tools/port_scanner.js"></script>
</body>
</html>
